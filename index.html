<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web RK4 — Métodos Numéricos</title>

    <!-- Librerías Externas (Math.js y Chart.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Hoja de Estilos Externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BANNER CABECERA DEGRADADO -->
    <header class="header-banner">
        <div class="header-content">
            <div class="header-text">
                <h1>Calculadora Web RK4 — Métodos Numéricos</h1>
                <p>Solución de EDOs de 1er Orden y Simulación de Fenómenos Físicos (Grupo 4)</p>
            </div>
            <button class="btn-team" onclick="abrirModalEquipo()">
                👥 Equipo de Trabajo
            </button>
        </div>
    </header>

    <div class="wrapper">
        <div class="layout-grid">
            
            <!-- PANEL IZQUIERDO: Configuración del Problema -->
            <main>
                <section class="app-card">
                    <h2 class="card-title">⚙️ Configuración del Problema</h2>
                    
                    <div id="mensajeError" class="alerta-error hidden"></div>

                    <!-- Selector de Fenómenos Físicos -->
                    <div class="input-group">
                        <label for="selectFenomeno">🎯 Fenómenos Físicos & Modelos Predeterminados:</label>
                        <select id="selectFenomeno" class="select-preset" onchange="cambiarFenomeno()">
                            <option value="caida">🪂 Caída Libre c/ Resistencia del Aire</option>
                            <option value="newton">🌡️ Enfriamiento de Newton</option>
                            <option value="poblacion">📈 Crecimiento Poblacional</option>
                            <option value="custom">✏️ Personalizado</option>
                        </select>
                    </div>

                    <!-- Ecuación Diferencial con Visualizador de Cursor Simulado -->
                    <div class="input-group">
                        <label for="eq"> dy/dx = f(x,y):</label>
                        <div class="virtual-input-wrapper" onclick="seleccionarCampo('eq')">
                            <div id="display_eq" class="virtual-display font-mono"></div>
                        </div>
                    </div>

                    <!-- Previsualización / Gráfico Vectorial -->
                    <div class="physics-illustration" id="panelFotoContainer">
                        <div id="panelSvgDefault"></div>
                    </div>

                    <!-- Condiciones Iniciales y Parámetros -->
                    <div class="form-grid">
                        <div class="input-group">
                            <label>x inicial (x₀):</label>
                            <div class="virtual-input-wrapper" onclick="seleccionarCampo('x0')">
                                <div id="display_x0" class="virtual-display"></div>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>y inicial (y₀):</label>
                            <div class="virtual-input-wrapper" onclick="seleccionarCampo('y0')">
                                <div id="display_y0" class="virtual-display"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>x final (xf):</label>
                            <div class="virtual-input-wrapper" onclick="seleccionarCampo('xf')">
                                <div id="display_xf" class="virtual-display"></div>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Tamaño de paso (h):</label>
                            <div class="virtual-input-wrapper" onclick="seleccionarCampo('h')">
                                <div id="display_h" class="virtual-display"></div>
                            </div>
                        </div>
                    </div>

                    <!-- TECLADO VIRTUAL TÁCTIL CON NAVEGACIÓN -->
                    <div class="virtual-keypad">
                        <button type="button" onclick="limpiarCampo()" class="btn-key-clear" title="Lim
